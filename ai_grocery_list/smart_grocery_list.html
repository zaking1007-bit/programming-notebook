
<!DOCTYPE html>
<html>
<head>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans, sans-serif); background: transparent; color: var(--color-text-primary); padding: 1rem 0; }
.header { margin-bottom: 1.5rem; }
.header h2 { font-size: 18px; font-weight: 500; margin-bottom: 4px; }
.header p { font-size: 13px; color: var(--color-text-secondary); }
.input-row { display: flex; gap: 8px; margin-bottom: 1.5rem; }
.input-row input { flex: 1; }
.input-row button { padding: 0 16px; white-space: nowrap; }
.status { font-size: 13px; color: var(--color-text-secondary); min-height: 20px; margin-bottom: 1rem; display: flex; align-items: center; gap: 6px; }
.spinner { width: 12px; height: 12px; border: 1.5px solid var(--color-border-secondary); border-top-color: var(--color-text-primary); border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.sections { display: flex; flex-direction: column; gap: 12px; }
.section-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg, 12px); overflow: hidden; }
.section-header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 0.5px solid var(--color-border-tertiary); }
.section-icon { font-size: 16px; color: var(--color-text-secondary); }
.section-title { font-size: 14px; font-weight: 500; }
.section-count { margin-left: auto; font-size: 12px; color: var(--color-text-secondary); background: var(--color-background-secondary); padding: 2px 8px; border-radius: 20px; }
.item-row { display: flex; align-items: center; padding: 9px 14px; border-bottom: 0.5px solid var(--color-border-tertiary); gap: 10px; }
.item-row:last-child { border-bottom: none; }
.item-name { font-size: 14px; flex: 1; }
.item-aisle { font-size: 12px; color: var(--color-text-secondary); background: var(--color-background-secondary); padding: 2px 8px; border-radius: var(--border-radius-md, 8px); white-space: nowrap; }
.item-delete { background: none; border: none; cursor: pointer; font-size: 16px; color: var(--color-text-secondary); padding: 2px 4px; line-height: 1; }
.item-delete:hover { color: var(--color-text-primary); }
.notion-btn { display: flex; align-items: center; gap: 6px; font-size: 13px; margin-top: 1.5rem; }
.notion-status { font-size: 13px; color: var(--color-text-secondary); margin-top: 8px; min-height: 18px; }
.empty { text-align: center; padding: 2rem; color: var(--color-text-secondary); font-size: 14px; }
</style>
</head>
<body>
<h2 class="sr-only">Smart Grocery List — Shawnee Walmart</h2>
<div class="header">
  <h2><i class="ti ti-shopping-cart" aria-hidden="true"></i> Smart grocery list</h2>
  <p>Shawnee, OK Walmart · type an item and Claude will categorize it + find the aisle</p>
</div>

<div class="input-row">
  <input type="text" id="item-input" placeholder="e.g. almond milk, chicken thighs, spaghetti..." />
  <button id="add-btn" onclick="addItem()"><i class="ti ti-plus" aria-hidden="true"></i> Add item</button>
</div>
<div class="status" id="status"></div>
<div class="sections" id="sections-container"></div>
<div id="empty-state" class="empty" style="display:none"><i class="ti ti-basket" aria-hidden="true" style="font-size:28px; display:block; margin-bottom:8px;"></i>Your list is empty — add something above</div>

<div style="margin-top: 1.5rem; border-top: 0.5px solid var(--color-border-tertiary); padding-top: 1.25rem; display: flex; align-items: center; gap: 12px;">
  <button id="notion-btn" onclick="saveToNotion()" style="display:flex; align-items:center; gap:6px;"><i class="ti ti-brand-notion" aria-hidden="true"></i> Save to Notion</button>
  <button onclick="clearAll()" style="display:flex; align-items:center; gap:6px;"><i class="ti ti-trash" aria-hidden="true"></i> Clear list</button>
</div>
<div class="notion-status" id="notion-status"></div>

<script>
const SECTION_ICONS = {
  'Produce': 'ti-leaf',
  'Meat & Seafood': 'ti-meat',
  'Dairy & Eggs': 'ti-egg',
  'Frozen Foods': 'ti-snowflake',
  'Bakery & Bread': 'ti-bread',
  'Pantry & Dry Goods': 'ti-archive',
  'Beverages': 'ti-bottle',
  'Snacks & Candy': 'ti-cookie',
  'Household & Cleaning': 'ti-spray',
  'Personal Care': 'ti-heart',
  'Baby & Kids': 'ti-baby-carriage',
  'Pet Supplies': 'ti-paw',
  'Deli': 'ti-cheese',
  'Pharmacy': 'ti-pill',
  'Other': 'ti-basket',
};

let items = [];

document.getElementById('item-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') addItem();
});

async function addItem() {
  const input = document.getElementById('item-input');
  const name = input.value.trim();
  if (!name) return;
  input.value = '';
  setStatus('<span class="spinner"></span> Categorizing "' + name + '"...');
  document.getElementById('add-btn').disabled = true;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: `You are a grocery store expert. Given a grocery item, respond ONLY with a JSON object (no markdown, no backticks) with these fields:
- "category": one of [Produce, Meat & Seafood, Dairy & Eggs, Frozen Foods, Bakery & Bread, Pantry & Dry Goods, Beverages, Snacks & Candy, Household & Cleaning, Personal Care, Baby & Kids, Pet Supplies, Deli, Pharmacy, Other]
- "aisle": a short string like "Aisle 4" or "Aisle 12–14" representing a plausible aisle at a Walmart Supercenter in Shawnee, OK (zip 74801). Use realistic Walmart aisle numbers (1–25 range). Produce is typically near entrance, dairy at back, frozen in center-back, etc.
- "displayName": a clean, properly capitalized version of the item name

Example output: {"category":"Dairy & Eggs","aisle":"Aisle 14–16","displayName":"Almond Milk"}`,
        messages: [{ role: 'user', content: name }]
      })
    });
    const data = await response.json();
    const text = data.content.filter(b => b.type === 'text').map(b => b.text).join('');
    const parsed = JSON.parse(text.replace(/```json|```/g, '').trim());
    items.push({ id: Date.now(), name: parsed.displayName || name, category: parsed.category || 'Other', aisle: parsed.aisle || 'Check store', checked: false });
    render();
    setStatus('');
  } catch (err) {
    items.push({ id: Date.now(), name, category: 'Other', aisle: 'Check store', checked: false });
    render();
    setStatus('Could not reach AI — item added to Other.');
    setTimeout(() => setStatus(''), 3000);
  }
  document.getElementById('add-btn').disabled = false;
}

function removeItem(id) {
  items = items.filter(i => i.id !== id);
  render();
}

function clearAll() {
  items = [];
  render();
  document.getElementById('notion-status').textContent = '';
}

function render() {
  const container = document.getElementById('sections-container');
  const empty = document.getElementById('empty-state');
  if (items.length === 0) { container.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  const grouped = {};
  items.forEach(item => { if (!grouped[item.category]) grouped[item.category] = []; grouped[item.category].push(item); });
  const order = ['Produce','Meat & Seafood','Deli','Dairy & Eggs','Frozen Foods','Bakery & Bread','Pantry & Dry Goods','Beverages','Snacks & Candy','Household & Cleaning','Personal Care','Baby & Kids','Pet Supplies','Pharmacy','Other'];
  const sorted = order.filter(c => grouped[c]);
  container.innerHTML = sorted.map(cat => {
    const catItems = grouped[cat];
    const icon = SECTION_ICONS[cat] || 'ti-basket';
    return `<div class="section-card">
      <div class="section-header">
        <i class="ti ${icon} section-icon" aria-hidden="true"></i>
        <span class="section-title">${cat}</span>
        <span class="section-count">${catItems.length}</span>
      </div>
      ${catItems.map(item => `
        <div class="item-row">
          <span class="item-name">${item.name}</span>
          <span class="item-aisle">${item.aisle}</span>
          <button class="item-delete" onclick="removeItem(${item.id})" aria-label="Remove ${item.name}"><i class="ti ti-x" aria-hidden="true"></i></button>
        </div>`).join('')}
    </div>`;
  }).join('');
}

async function saveToNotion() {
  if (items.length === 0) { document.getElementById('notion-status').textContent = 'Nothing to save — add some items first.'; return; }
  document.getElementById('notion-btn').disabled = true;
  document.getElementById('notion-status').innerHTML = '<span class="spinner"></span> Saving to Notion...';
  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: 'You help save grocery lists to Notion. Create a new Notion page titled "Grocery List — [today\'s date]" and add each item as a to-do block with the category and aisle as context. Return a brief confirmation message.',
        messages: [{ role: 'user', content: 'Save this grocery list to my Notion: ' + JSON.stringify(items.map(i => ({ name: i.name, category: i.category, aisle: i.aisle }))) }],
        mcp_servers: [{ type: 'url', url: 'https://mcp.notion.com/mcp', name: 'notion-mcp' }]
      })
    });
    const data = await response.json();
    const text = data.content.filter(b => b.type === 'text').map(b => b.text).join('');
    document.getElementById('notion-status').textContent = text || 'Saved to Notion!';
  } catch (err) {
    document.getElementById('notion-status').textContent = 'Could not save to Notion — check your connection.';
  }
  document.getElementById('notion-btn').disabled = false;
}

function setStatus(html) { document.getElementById('status').innerHTML = html; }
render();
</script>
</body>
</html>
